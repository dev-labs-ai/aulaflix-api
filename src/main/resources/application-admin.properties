# The jar's command-line mode runs next to the live API: no web server, a small pool, and quiet framework logs so
# the terminal shows the command's own output and the application's INFO audit lines.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN
logging.level.com.devlabs.aulaflix=INFO
spring.datasource.hikari.maximum-pool-size=2
