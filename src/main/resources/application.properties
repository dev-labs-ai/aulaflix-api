spring.application.name=aulaflix-api

# Secrets are files named after the property they set: /run/secrets/ in containers, ./secrets/ when the API runs
# from the IDE or ./mvnw spring-boot:run against the local Compose stack.
spring.config.import=optional:configtree:/run/secrets/,optional:configtree:secrets/

spring.datasource.url=jdbc:postgresql://localhost:5432/aulaflix
spring.datasource.username=aulaflix
# PostgreSQL allows 100 connections: this pool, the admin command's 2 and psql sessions stay far below it
spring.datasource.hikari.maximum-pool-size=10

# The schema belongs to Flyway; migrations are timestamp-versioned and merged out of order
spring.jpa.hibernate.ddl-auto=none
spring.flyway.out-of-order=true

spring.jpa.open-in-view=false
# springdoc brings Jackson 2 along, which Hibernate would otherwise prefer for JSON columns over Boot's Jackson 3
spring.jpa.properties.hibernate.type.json_format_mapper=jackson3
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.threads.virtual.enabled=true

# Spring's forwarded headers stay off, even on a platform where Boot would turn them on by itself: the browser's IP
# arrives as AulaFlix-Client-IP, read only behind a valid BFF key, and nothing else may rewrite the request
server.forward-headers-strategy=none

# Hard limits, counted in memory, so a restart forgets them. Every BFF request counts against its client IP, an IPv6
# client by its /64
aulaflix.rate-limits.bff-requests.requests=600
aulaflix.rate-limits.bff-requests.window=1m
# Playback without a session, which only the Free lesson answers, counts against its client IP too, whatever it answers
aulaflix.rate-limits.visitor-playback.requests=30
aulaflix.rate-limits.visitor-playback.window=1h
# The cheapest ways to learn who has an Account (ADR 0005), whatever they answer: the email look-up and sign-in
# together, and sign-up
aulaflix.rate-limits.look-ups-and-sign-ins.requests=60
aulaflix.rate-limits.look-ups-and-sign-ins.window=1h
aulaflix.rate-limits.sign-ups.requests=10
aulaflix.rate-limits.sign-ups.window=24h

# A new password must not be one HIBP has seen in a breach. Only the first 5 hex digits of its SHA-1 are sent; past
# the timeout, or on any failure, the password is taken unchecked, with a WARN
aulaflix.hibp.base-url=https://api.pwnedpasswords.com
aulaflix.hibp.timeout=3s

# Lesson videos live in the storage, reached only through the S3 API (ADR 0003). The API reads and deletes at the
# internal endpoint; the URLs it signs name the public one, which the browser and the Admin's curl reach. Its two keys
# are secret files: aulaflix.storage.read-write.access-key-id and .secret-access-key, and the same for read-only
aulaflix.storage.internal-endpoint=http://localhost:9000
aulaflix.storage.public-endpoint=http://localhost:9000
aulaflix.storage.bucket=videos
aulaflix.storage.region=us-east-1
aulaflix.storage.playback-url-lifetime=4h

# A field that doesn't fit the resource's state is omitted from the JSON, never sent as null
spring.jackson.default-property-inclusion=non_null
# Money travels in integer cents: 49700.5 is refused, never cut down to 49700
spring.jackson.deserialization.accept-float-as-int=false

# Accounts sign in through the API's own sessions, so Boot's generated in-memory user, and the password it logs, stay
# out, in admin mode too
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# The OpenAPI document and Swagger UI are on in every environment, on purpose: like /v1/admin/**, they are reached only
# through the SSH tunnel, and the edge proxy never routes them
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
