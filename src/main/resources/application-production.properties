# Production, on the VPS: only what differs from application.properties, and nothing secret. The production Compose
# file (deploy/compose.yaml) turns this profile on; every secret is a file under /run/secrets/, named after its
# property, and listed in deploy/.env.example.

# PostgreSQL and the storage run beside the API, on the internal aulaflix-data network
spring.datasource.url=jdbc:postgresql://postgres:5432/aulaflix

# The API reads and deletes at the storage itself; the URLs it signs name the media hostname, which the edge proxies to
# the same storage with the Host header intact, so the signatures hold
aulaflix.storage.internal-endpoint=http://storage:9000
aulaflix.storage.public-endpoint=https://media.aulaflix.com.br

# webBase: every link in an email, and the Asaas Checkout's return URLs, point at the web
aulaflix.web.base-url=https://aulaflix.com.br

# Asaas's production API, with the production keys (secret files aulaflix.asaas.api-key and
# aulaflix.asaas.webhook-token)
aulaflix.asaas.base-url=https://api.asaas.com/v3

# Amazon SES over SMTP, on 587 with STARTTLS required, so a downgraded connection never sends in clear. The SMTP
# credentials are the secret files spring.mail.username and spring.mail.password. If the VPS blocks 587, SES also
# listens on 2587 with STARTTLS
spring.mail.host=email-smtp.sa-east-1.amazonaws.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
aulaflix.outbox.from=AulaFlix <contato@aulaflix.com.br>
# Below the SES account's maximum send rate: one a second is the sandbox's rate, the lowest an account has. Read the
# real maximum with `aws sesv2 get-account` (SendQuota.MaxSendRate) and raise this, staying below it
aulaflix.outbox.send-rate.emails=1
aulaflix.outbox.send-rate.per=1s

# Turnstile needs no setting here: the API verifies against Cloudflare's siteverify by default, with the real secret
# in the file aulaflix.turnstile.secret-key, while the web holds the matching site key
