# AulaFlix's server blocks for the edge, the nginx that vps-edge runs in front of every site on the VPS. vps-edge
# includes this file inside its http block, as /etc/nginx/conf.d/aulaflix.conf, and provides:
#   - load_module modules/ngx_http_js_module.so; in its main context, and aulaflix-media.js at /etc/nginx/njs/;
#   - the edge-aulaflix network, where web:3000, api:8080 and storage:9000 resolve through Docker's DNS;
#   - certbot's HTTP-01 webroot at /var/www/certbot, and one certificate for aulaflix.com.br, www.aulaflix.com.br,
#     media.aulaflix.com.br and api.aulaflix.com.br at /etc/letsencrypt/live/aulaflix.com.br/.
#
# Every upstream is named through a variable, so nginx resolves it per request: the edge starts while an AulaFlix
# container is down, and follows a container that Compose recreates with a new address.
#
# Each proxying location sets all its proxy_set_header lines itself, because a location that sets any of them
# inherits none from its server. HSTS goes without includeSubDomains, and only over HTTPS, where browsers heed it.

# media.aulaflix.com.br: a GET or HEAD counts against its client's IPv4 address, or its IPv6 /64 (the njs key). A PUT,
# the Admin's upload, has an empty key, which nginx does not count, and no rate limit
js_import aulaflix_media from /etc/nginx/njs/aulaflix-media.js;
js_set $aulaflix_media_client aulaflix_media.clientKey;

map $request_method $aulaflix_media_limit_key {
    GET     $aulaflix_media_client;
    HEAD    $aulaflix_media_client;
    default "";
}

map $request_method $aulaflix_media_rate_after {
    GET     4m;
    HEAD    4m;
    default 0;
}

map $request_method $aulaflix_media_rate {
    GET     1m;
    HEAD    1m;
    default 0;
}

limit_conn_zone $aulaflix_media_limit_key zone=aulaflix_media:10m;

# The video URLs are presigned, so their query string is a credential: the access log keeps the path alone
log_format aulaflix_media '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Port 80 answers certbot's challenge, and sends everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aulaflix.com.br media.aulaflix.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.aulaflix.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aulaflix.com.br$request_uri;
    }
}

# The API serves nothing over plain HTTP
server {
    listen 80;
    listen [::]:80;
    server_name api.aulaflix.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

# The web: every path
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aulaflix.com.br;

    ssl_certificate /etc/letsencrypt/live/aulaflix.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aulaflix.com.br/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $aulaflix_web http://web:3000;
        proxy_pass $aulaflix_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The client's own address, replacing whatever it sent: the BFF passes it on as AulaFlix-Client-IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aulaflix.com.br;

    ssl_certificate /etc/letsencrypt/live/aulaflix.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aulaflix.com.br/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 301 https://aulaflix.com.br$request_uri;
    }
}

# The storage, path-style, for the presigned URLs alone: /videos/lessons/{lessonId}/{uuid}.mp4?X-Amz-…
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.aulaflix.com.br;

    ssl_certificate /etc/letsencrypt/live/aulaflix.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aulaflix.com.br/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/access.log aulaflix_media;

    resolver 127.0.0.11 valid=10s;

    if ($request_method !~ ^(GET|HEAD|PUT)$) {
        return 404;
    }

    location /videos/ {
        # One downloader can't burn the month's 16 TB: 6 connections per client, each at full speed for its first 4 MB
        # (the moov box and the first seconds), then at 1 MB/s
        limit_conn aulaflix_media 6;
        limit_conn_status 429;
        limit_rate_after $aulaflix_media_rate_after;
        limit_rate $aulaflix_media_rate;
        # Videos stream through, never into a temporary file on the edge's disk
        proxy_max_temp_file_size 0;

        # An upload of up to 5 GiB streams to the storage as it arrives
        client_max_body_size 5g;
        proxy_request_buffering off;

        set $aulaflix_storage http://storage:9000;
        proxy_pass $aulaflix_storage;
        proxy_http_version 1.1;
        # The URL was signed for this hostname, so the storage must see it
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}

# The API: the Asaas webhook alone, from Asaas's production IPs alone
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aulaflix.com.br;

    ssl_certificate /etc/letsencrypt/live/aulaflix.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aulaflix.com.br/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=10s;

    location = /v1/webhooks/asaas {
        if ($request_method != POST) {
            return 404;
        }

        # If Asaas changes them, deliveries get a 403 and its queue pauses after 15 failures; reconciliation keeps
        # Orders moving meanwhile
        allow 52.67.12.206;
        allow 18.230.8.159;
        allow 54.94.136.112;
        allow 54.94.183.101;
        deny all;

        client_max_body_size 256k;

        set $aulaflix_api http://api:8080;
        proxy_pass $aulaflix_api;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Only the BFF may send these, and it never comes this way
        proxy_set_header AulaFlix-BFF-Key "";
        proxy_set_header AulaFlix-Client-IP "";
    }

    location / {
        return 404;
    }
}
