# The API's dependencies for local development. The API itself runs from the IDE or with ./mvnw spring-boot:run.
# Each secret is a git-ignored file in ./secrets/, named after the property it sets, and mounted at /run/secrets/.
name: aulaflix

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: aulaflix
      POSTGRES_USER: aulaflix
      POSTGRES_PASSWORD_FILE: /run/secrets/spring.datasource.password
    secrets:
      - spring.datasource.password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=aulaflix --dbname=aulaflix"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  spring.datasource.password:
    file: ./secrets/spring.datasource.password

volumes:
  postgres-data:
