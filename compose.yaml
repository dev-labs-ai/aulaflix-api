# The API's dependencies for local development. The API itself runs from the IDE or with ./mvnw spring-boot:run.
# The `full` profile adds the API and web images, for the Admin's content rehearsal: docker compose --profile full up
# Each secret is a git-ignored file in ./secrets/, named after the property it sets, and mounted at /run/secrets/.
# Optional settings, none of them secret, go in a git-ignored .env file; see .env.example.
name: aulaflix

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: aulaflix
      POSTGRES_USER: aulaflix
      POSTGRES_PASSWORD_FILE: /run/secrets/spring.datasource.password
    secrets:
      - spring.datasource.password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=aulaflix --dbname=aulaflix"]
      interval: 5s
      timeout: 3s
      retries: 10

  # AIStor Free, the storage of Lesson videos (ADR 0003). Only the S3 API is published; the console is not.
  storage:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    command: ["server", "/data", "--license", "/run/secrets/minio.license"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/storage.root-user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/storage.root-password
    secrets:
      - minio.license
      - storage.root-user
      - storage.root-password
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, on every up: the private videos bucket and the API's two users. Running it again changes nothing.
  storage-init:
    image: quay.io/minio/aistor/mc:RELEASE.2026-09-19T15-24-59Z
    entrypoint: ["sh", "/storage/init.sh"]
    environment:
      STORAGE_URL: http://storage:9000
    secrets:
      - storage.root-user
      - storage.root-password
      - aulaflix.storage.read-only.access-key-id
      - aulaflix.storage.read-only.secret-access-key
      - aulaflix.storage.read-write.access-key-id
      - aulaflix.storage.read-write.secret-access-key
    volumes:
      - ./storage:/storage:ro
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"

  # Mailpit catches every email the API sends locally: SMTP on 1025, without TLS, and the inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # The API's image, built from this repository. `docker compose run --rm api admin …` runs the admin command in it,
  # with a terminal for the password. Only what differs from the IDE's run is set here, and nothing secret.
  api:
    profiles: [full]
    build: .
    image: aulaflix-api:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aulaflix
      # aulaflix.storage.internal-endpoint: the API reads and deletes at storage:9000, but signs URLs for the default
      # public endpoint, localhost:9000, where the browser and curl reach the storage
      AULAFLIX_STORAGE_INTERNALENDPOINT: http://storage:9000
      # spring.mail.*: the outbox sends to Mailpit on the Compose network, without TLS, as from the IDE
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    secrets:
      - spring.datasource.password
      - aulaflix.bff.key
      - aulaflix.codes.hmac-key
      - aulaflix.storage.read-only.access-key-id
      - aulaflix.storage.read-only.secret-access-key
      - aulaflix.storage.read-write.access-key-id
      - aulaflix.storage.read-write.secret-access-key
      - aulaflix.asaas.api-key
      - aulaflix.asaas.webhook-token
      - aulaflix.turnstile.secret-key
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      # The outbox connects only when it sends, and a failed send waits for the next try, so started is enough
      mailpit:
        condition: service_started
    # The heap is 75% of it (-XX:MaxRAMPercentage=75), as in production
    mem_limit: 1536m
    # Longer than Spring Boot's graceful shutdown, 30 s at most, so docker stop never kills it mid-drain
    stop_grace_period: 40s

  # The web, from aulaflix-web's private image on GHCR (docker login ghcr.io first), on webBase, localhost:3001. Nuxt
  # takes its config as NUXT_* variables: the BFF key is read from its secret file as the server starts, so it stays
  # out of the Compose file and of docker inspect. This expects the image to have sh, and to start Nuxt's server with
  # node .output/server/index.mjs from its working directory.
  web:
    profiles: [full]
    image: ghcr.io/dev-labs-ai/aulaflix-web:${AULAFLIX_WEB_TAG:-latest}
    entrypoint:
      - sh
      - -c
      - NUXT_BFF_KEY="$$(cat /run/secrets/aulaflix.bff.key)" && export NUXT_BFF_KEY && exec node .output/server/index.mjs
    environment:
      NUXT_API_BASE_URL: http://api:8080
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    secrets:
      - aulaflix.bff.key
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api:
        condition: service_started
    # Longer than Nitro's wait for the requests in flight, 30 s at most, so docker stop never kills it mid-drain
    stop_grace_period: 40s

secrets:
  spring.datasource.password:
    file: ./secrets/spring.datasource.password
  aulaflix.bff.key:
    file: ./secrets/aulaflix.bff.key
  aulaflix.codes.hmac-key:
    file: ./secrets/aulaflix.codes.hmac-key
  minio.license:
    file: ./secrets/minio.license
  storage.root-user:
    file: ./secrets/storage.root-user
  storage.root-password:
    file: ./secrets/storage.root-password
  aulaflix.storage.read-only.access-key-id:
    file: ./secrets/aulaflix.storage.read-only.access-key-id
  aulaflix.storage.read-only.secret-access-key:
    file: ./secrets/aulaflix.storage.read-only.secret-access-key
  aulaflix.storage.read-write.access-key-id:
    file: ./secrets/aulaflix.storage.read-write.access-key-id
  aulaflix.storage.read-write.secret-access-key:
    file: ./secrets/aulaflix.storage.read-write.secret-access-key
  aulaflix.asaas.api-key:
    file: ./secrets/aulaflix.asaas.api-key
  aulaflix.asaas.webhook-token:
    file: ./secrets/aulaflix.asaas.webhook-token
  aulaflix.turnstile.secret-key:
    file: ./secrets/aulaflix.turnstile.secret-key

volumes:
  postgres-data:
  storage-data:
